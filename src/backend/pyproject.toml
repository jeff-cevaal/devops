[project]
name = "study-tracker-backend"
version = "0.2.0"
description = "Backend API for tracking study time for DevOps certifications"
readme = "README.md"
authors = [
  { name = "Jeff Cevaal", email = "jeff-cevaal@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
]

[project.scripts]
study-tracker-api = "backend.main:main"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src/backend"]

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
